name: Directory flavor

# Every change checks that the directory flavor still builds and meets directory policy.
# A version tag (v0.1.8) also publishes it to the mirror repository and attaches the OpenAI bundle to a release.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MIRROR_REPO: MotleyAI/motley-skills-directory

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the directory flavor
        run: python3 scripts/build_directory_flavor.py --out "$RUNNER_TEMP/directory" --zip "$RUNNER_TEMP/motley-openai-plugin.zip"

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - name: Build the directory flavor
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 source/scripts/build_directory_flavor.py \
            --out "$RUNNER_TEMP/directory" \
            --zip "$RUNNER_TEMP/motley-openai-plugin-$version.zip" \
            --expect-version "$version"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MIRROR_REPO }}
          ssh-key: ${{ secrets.DIRECTORY_MIRROR_DEPLOY_KEY }}
          path: mirror
          fetch-depth: 0

      - name: Push the flavor to the mirror
        working-directory: mirror
        run: |
          rsync --archive --delete --exclude .git "$RUNNER_TEMP/directory/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit --message "Sync ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} (${GITHUB_REF_NAME})" \
              --message "Generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Do not edit this repository by hand."
            git push origin HEAD:main
          fi
          # A rerun of the same tag finds the tag and leaves it alone.
          if ! git rev-parse --quiet --verify "refs/tags/${GITHUB_REF_NAME}" > /dev/null; then
            git tag "${GITHUB_REF_NAME}"
            git push origin "refs/tags/${GITHUB_REF_NAME}"
          fi

      - name: Attach the OpenAI bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="$RUNNER_TEMP/motley-openai-plugin-${GITHUB_REF_NAME#v}.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$bundle" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$bundle" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
